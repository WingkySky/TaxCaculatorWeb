<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>测试修复</title>
<style>
body { font-family: sans-serif; padding: 20px; }
.test-case { margin: 15px 0; padding: 10px; border: 1px solid #ddd; }
.pass { color: green; }
.fail { color: red; }
</style>
</head>
<body>
<h1>测试 normalizeMonth 对带时间的日期解析</h1>
<div id="results"></div>
<script>
function normalizeMonth(raw) {
  if (!raw || raw === '-') return '-';
  let s = String(raw).trim();

  if (/^\d{5,}$/.test(s)) {
    const serial = parseInt(s);
    if (serial > 30000 && serial < 60000) {
      const epoch = new Date(1899, 11, 30);
      const d = new Date(epoch.getTime() + serial * 86400000);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }
  }

  let m = s.match(/(\d{4})\s*年\s*(\d{1,2})\s*月?/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}`;

  m = s.match(/^(\d{1,2})\s*月$/);
  if (m) {
    const year = new Date().getFullYear();
    return `${year}-${m[1].padStart(2, '0')}`;
  }

  const MONTH_EN = { jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',
                     jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12' };
  m = s.match(/^([A-Za-z]{3})[-\/.\s]?(\d{2,4})$/);
  if (m) {
    const monKey = m[1].toLowerCase();
    const monNum = MONTH_EN[monKey];
    if (monNum) {
      let yr = parseInt(m[2]);
      if (yr < 100) yr += 2000;
      return `${yr}-${monNum}`;
    }
  }

  m = s.match(/^(\d{4})[-\/.\s]?(\d{1,2})(?:[-\/.\s]?\d{1,2})?(?:\s+\d{1,2}:\d{1,2}(?::\d{1,2})?)?$/);
  if (m && parseInt(m[2]) >= 1 && parseInt(m[2]) <= 12) return `${m[1]}-${m[2].padStart(2, '0')}`;

  m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:\s+\d{1,2}:\d{1,2}(?::\d{1,2})?)?$/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}`;

  return s;
}

function extractMonthHint(text) {
  if (!text) return '';
  const raw = String(text).trim();
  const patterns = [
    /(?:^|[^\d])(20\d{2}\s*年\s*\d{1,2}\s*月)(?:[^\d]|$)/,
    /(?:^|[^\d])(20\d{2}[-\/.]\d{1,2})(?:[-\/.]\d{1,2})?(?:\s+\d{1,2}:\d{1,2}(?::\d{1,2})?)?(?:[^\d]|$)/,
    /(?:^|[^\d])((?:20\d{2})(?:0[1-9]|1[0-2]))(?:[^\d]|$)/
  ];
  for (const re of patterns) {
    const m = raw.match(re);
    if (!m) continue;
    const normalized = normalizeMonth(m[1]);
    if (/^\d{4}-\d{2}$/.test(normalized)) return normalized;
  }
  return '';
}

const testCases = [
  '2026-04-28 11:45:52',
  '2026-04-02 14:26:31',
  '2026-02-13 18:13:30',
  '2026-02-03 17:07:51',
  '2026-01-06 11:24:12',
  '2025-12-08 09:20:39',
  '2025-11-06 22:28:17',
  '2024-09-29 18:03:56',
  '2024-09-06 16:07:09'
];

const resultsDiv = document.getElementById('results');
testCases.forEach(str => {
  const normalized = normalizeMonth(str);
  const isOK = /^\d{4}-\d{2}$/.test(normalized);

  const caseDiv = document.createElement('div');
  caseDiv.className = 'test-case';

  const statusSpan = document.createElement('span');
  statusSpan.textContent = isOK ? '✓ PASS' : '✗ FAIL';
  statusSpan.className = isOK ? 'pass' : 'fail';

  const inputSpan = document.createElement('span');
  inputSpan.style.marginLeft = '10px';
  inputSpan.textContent = `输入: ${str}`;

  const outputSpan = document.createElement('span');
  outputSpan.style.marginLeft = '10px';
  outputSpan.textContent = `输出: ${normalized}`;

  caseDiv.appendChild(statusSpan);
  caseDiv.appendChild(inputSpan);
  caseDiv.appendChild(outputSpan);
  resultsDiv.appendChild(caseDiv);
});

</script>
</body>
</html>
